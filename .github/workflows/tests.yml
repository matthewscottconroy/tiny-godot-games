name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Godot only reports GDScript warnings (unused variables, shadowed names,
      # style) inside the editor — a headless run prints nothing. gdtoolkit is
      # what gives CI a static check below the level of "it fails to parse".
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: gdformat --check
        run: gdformat --check $(git ls-files '*.gd')

      - name: gdlint
        run: gdlint $(git ls-files '*.gd')

  test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.1"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot (headless)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL "$url" -o /tmp/godot.zip
          unzip -o /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      # Importing 156 cold projects is the single most expensive step. The cache
      # is keyed on the project sources, so it is reused until a demo changes;
      # run-tests.sh re-imports only the demos whose files are newer than their
      # cache, so a partially stale restore still produces a correct run.
      - name: Cache Godot import artifacts
        uses: actions/cache@v4
        with:
          path: "*/.godot"
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('*/project.godot', '*/**/*.gd', '*/**/*.tscn', '*/**/*.gdshader', '*/**/*.svg') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-

      - name: Run checks
        # run-tests.sh imports what needs importing (generating .godot/ so
        # class_name globals and assets resolve), then boots every demo's main
        # scene headless before running its logic suite. The smoke step is what
        # catches a demo whose scripts do not parse — the logic suites build
        # their own objects and would stay green regardless. Demos are
        # independent projects, so the work fans out across the runner's cores.
        run: |
          export PATH="$HOME/godot:$PATH"
          ./run-tests.sh
